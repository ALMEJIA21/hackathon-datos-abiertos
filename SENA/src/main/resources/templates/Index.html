<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hackathon Java + Spring Boot | Datos Abiertos</title>
    <!-- Bootstrap CSS para diseño rápido y limpio -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm p-4 mb-4 bg-white rounded">
            <h1 class="text-primary mb-3">Portal de Movilidad y Datos Abiertos</h1>
            <p class="text-muted">Consulta y filtra registros reales obtenidos desde datos.gov.co</p>
            
            <!-- Formulario de Búsqueda / Filtrado -->
            <form method="get" action="/" class="row g-3">
                <div class="col-auto">
                    <input type="text" name="filtro" class="form-control" placeholder="Buscar por localidad o vehículo..." th:value="${filtro}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary mb-3">Filtrar Datos</button>
                </div>
                <div class="col-auto" th:if="${filtro != null && !filtro.isEmpty()}">
                    <a href="/" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>
        </div>

        <!-- Tabla de Resultados -->
        <div class="card shadow-sm p-4 bg-white rounded">
            <h3 class="mb-3">Registros Encontrados</h3>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Fecha</th>
                        <th>Localidad</th>
                        <th>Vehículo</th>
                        <th>Gravedad</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="record : ${records}">
                        <td th:text="${record.fecha}">2026-01-10</td>
                        <td th:text="${record.localidad}">Bosa</td>
                        <td th:text="${record.tipoVehiculo}">Motocicleta</td>
                        <td th:text="${record.gravedad}">Leve</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(records)}">
                        <td colspan="4" class="text-center text-muted">No se encontraron registros asociados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
